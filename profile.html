<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#6c63ff"
  >

  <title>Profile</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <main class="profile-page">

    <button
      id="backBtn"
      class="back-btn"
      type="button"
    >
      ← Back
    </button>


    <section
      id="profileCard"
      class="profile-card"
    >

      <div
        id="profileAvatar"
        class="large-avatar"
      >
        👤
      </div>


      <h1 id="profileName">
        Loading...
      </h1>


      <p id="profileHandle">
      </p>


      <p
        id="profileBio"
        class="profile-bio"
      >
      </p>


      <div
        id="profileActions"
        class="profile-actions"
      >
      </div>


      <section class="profile-content">

        <h2>
          Shared / Uploaded Media
        </h2>

        <p class="muted">
          Media will appear here as the media system is added.
        </p>

      </section>

    </section>

  </main>


  <script
    type="module"
    src="js/profile.js"
  ></script>

</body>

</html>

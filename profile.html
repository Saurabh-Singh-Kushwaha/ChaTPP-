<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Profile • Connect</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    body.profile-body {
      margin: 0;
      background: #f5f7fb;
      color: #111827;
    }

    .profile-topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .profile-back-btn,
    .profile-menu-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 24px;
      cursor: pointer;
    }

    .profile-back-btn:active,
    .profile-menu-btn:active {
      transform: scale(.95);
    }

    .profile-top-title {
      font-size: 19px;
      font-weight: 800;
    }

    .profile-wrapper {
      max-width: 620px;
      margin: auto;
      padding: 20px 14px 40px;
    }

    .profile-hero {
      background: #fff;
      border-radius: 24px;
      padding: 30px 18px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(15,23,42,.07);
    }

    .profile-avatar-large {
      width: 108px;
      height: 108px;
      margin: 0 auto 17px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e7ff;
      color: #5b55e8;
      font-size: 40px;
      font-weight: 800;
      border: 4px solid #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }

    .profile-avatar-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 800;
      word-break: break-word;
    }

    .profile-handle {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 15px;
    }

    .profile-bio {
      max-width: 500px;
      margin: 14px auto 0;
      color: #475569;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .profile-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 23px;
    }

    .profile-action {
      min-height: 49px;
      border: 0;
      border-radius: 15px;
      padding: 0 12px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }

    .profile-action:active {
      transform: scale(.98);
    }

    .profile-action.primary {
      background: #4f46e5;
      color: #fff;
    }

    .profile-action.secondary {
      background: #eef2ff;
      color: #3730a3;
    }

    .profile-action.share {
      background: #f1f5f9;
      color: #334155;
    }

    .profile-action.full {
      grid-column: 1 / -1;
    }

    .profile-action:disabled {
      opacity: .65;
      cursor: default;
    }

    .relationship-status {
      margin-top: 14px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.4;
    }

    /* THREE DOT MENU */

    .profile-menu-wrapper {
      position: relative;
    }

    .profile-menu {
      position: absolute;
      top: 52px;
      right: 0;
      width: 190px;
      background: #fff;
      border-radius: 16px;
      padding: 7px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
      border: 1px solid #e5e7eb;
      display: none;
      z-index: 100;
    }

    .profile-menu.show {
      display: block;
    }

    .profile-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 12px 13px;
      border-radius: 11px;
      font-size: 14px;
      cursor: pointer;
      color: #1e293b;
    }

    .profile-menu button:hover {
      background: #f1f5f9;
    }

    .profile-menu .danger {
      color: #dc2626;
    }

    .profile-error {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #fef2f2;
      color: #b91c1c;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 380px) {

      .profile-actions {
        grid-template-columns: 1fr;
      }

      .profile-action.full {
        grid-column: auto;
      }

    }

  </style>

</head>


<body class="profile-body">


  <header class="profile-topbar">

    <button
      id="backBtn"
      class="profile-back-btn"
      type="button"
      aria-label="Back"
    >
      ←
    </button>


    <div class="profile-top-title">
      Profile
    </div>


    <div class="profile-menu-wrapper">

      <button
        id="profileMenuBtn"
        class="profile-menu-btn"
        type="button"
        aria-label="Profile options"
        aria-expanded="false"
      >
        ⋮
      </button>


      <div
        id="profileMenu"
        class="profile-menu"
      >

        <button
          id="copyProfileLinkBtn"
          type="button"
        >
          🔗 Copy Profile Link
        </button>


        <button
          id="copyHandleBtn"
          type="button"
        >
          @ Copy Handle
        </button>


        <button
          id="closeMenuBtn"
          type="button"
        >
          ✕ Close
        </button>

      </div>

    </div>

  </header>



  <main class="profile-wrapper">


    <section class="profile-hero">


      <div
        id="profileAvatar"
        class="profile-avatar-large"
      >
        ?
      </div>


      <h1
        id="profileName"
        class="profile-name"
      >
        Loading...
      </h1>


      <p
        id="profileHandle"
        class="profile-handle"
      ></p>


      <p
        id="profileBio"
        class="profile-bio"
      ></p>


      <div class="profile-actions">

        <button
          id="chatBtn"
          class="profile-action primary"
          type="button"
          style="display:none;"
        >
          💬 Chat
        </button>


        <button
          id="friendBtn"
          class="profile-action secondary"
          type="button"
        >
          🤝 Add Friend
        </button>


        <button
          id="shareBtn"
          class="profile-action share full"
          type="button"
        >
          🔗 Share Profile
        </button>

      </div>


      <div
        id="relationshipStatus"
        class="relationship-status"
      ></div>

    </section>


    <div
      id="profileError"
      class="profile-error hidden"
    ></div>


  </main>


  <script
    type="module"
    src="js/profile.js"
  ></script>

</body>

</html>

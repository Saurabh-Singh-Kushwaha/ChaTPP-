<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Profile • Connect</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    /* =====================================
       OTHER USER PROFILE PAGE
    ===================================== */

    body.profile-body {
      margin: 0;
      background: #f5f7fb;
      color: #111827;
    }


    .profile-topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 20;
    }


    .profile-back-btn,
    .profile-menu-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #f1f5f9;
      font-size: 22px;
      cursor: pointer;
    }


    .profile-top-title {
      font-size: 18px;
      font-weight: 700;
    }


    .profile-wrapper {
      max-width: 620px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }


    /* HERO */

    .profile-hero {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 18px 22px;
      text-align: center;
      box-shadow:
        0 8px 30px rgba(15, 23, 42, 0.07);
    }


    .profile-avatar-large {
      width: 108px;
      height: 108px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e7ff;
      color: #5b55e8;
      font-size: 40px;
      font-weight: 800;
      border: 4px solid #ffffff;
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.12);
    }


    .profile-avatar-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .profile-name {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 800;
      word-break: break-word;
    }


    .profile-handle {
      margin: 7px 0 0;
      color: #64748b;
      font-size: 15px;
    }


    .profile-bio {
      max-width: 500px;
      margin: 14px auto 0;
      color: #475569;
      line-height: 1.55;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }


    /* ACTIONS */

    .profile-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }


    .profile-action {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      padding: 0 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    .profile-action:active {
      transform: scale(0.97);
    }


    .profile-action.primary {
      background: #4f46e5;
      color: #ffffff;
    }


    .profile-action.secondary {
      background: #eef2ff;
      color: #3730a3;
    }


    .profile-action.share {
      background: #f1f5f9;
      color: #334155;
    }


    .profile-action.full {
      grid-column: 1 / -1;
    }


    .profile-action:disabled {
      opacity: 0.65;
      cursor: default;
    }


    /* STATUS */

    .relationship-status {
      margin-top: 14px;
      min-height: 20px;
      color: #64748b;
      font-size: 13px;
    }


    /* MEDIA */

    .profile-section {
      margin-top: 18px;
      background: #ffffff;
      border-radius: 22px;
      padding: 20px 16px;
      box-shadow:
        0 5px 22px rgba(15, 23, 42, 0.05);
    }


    .profile-section-title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
    }


    .profile-section-subtitle {
      margin: 5px 0 18px;
      color: #64748b;
      font-size: 13px;
    }


    .media-empty {
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 30px 15px;
      text-align: center;
      color: #64748b;
    }


    .media-empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }


    .media-empty strong {
      display: block;
      color: #334155;
      margin-bottom: 5px;
    }


    /* ERROR */

    .profile-error {
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      background: #fef2f2;
      color: #b91c1c;
      text-align: center;
      font-size: 14px;
    }


    .hidden {
      display: none !important;
    }


    @media (max-width: 380px) {

      .profile-actions {
        grid-template-columns: 1fr;
      }

      .profile-action.full {
        grid-column: auto;
      }

    }

  </style>

</head>


<body class="profile-body">


  <!-- ===================================
       TOP BAR
  ==================================== -->

  <header class="profile-topbar">

    <button
      id="backBtn"
      class="profile-back-btn"
      type="button"
      aria-label="Go back"
    >
      ←
    </button>


    <div class="profile-top-title">
      Profile
    </div>


    <button
      id="profileMenuBtn"
      class="profile-menu-btn"
      type="button"
      aria-label="Profile options"
    >
      ⋮
    </button>

  </header>



  <!-- ===================================
       MAIN
  ==================================== -->

  <main class="profile-wrapper">


    <!-- PROFILE HERO -->

    <section class="profile-hero">


      <div
        id="profileAvatar"
        class="profile-avatar-large"
      >
        ?
      </div>


      <h1
        id="profileName"
        class="profile-name"
      >
        Loading...
      </h1>


      <p
        id="profileHandle"
        class="profile-handle"
      >
      </p>


      <p
        id="profileBio"
        class="profile-bio"
      >
      </p>


      <!-- ACTION BUTTONS -->

      <div class="profile-actions">


        <button
          id="chatBtn"
          class="profile-action primary"
          type="button"
          style="display:none;"
        >
          💬 Chat
        </button>


        <button
          id="friendBtn"
          class="profile-action secondary"
          type="button"
        >
          🤝 Add Friend
        </button>


        <button
          id="shareBtn"
          class="profile-action share full"
          type="button"
        >
          🔗 Share Profile
        </button>


      </div>


      <div
        id="relationshipStatus"
        class="relationship-status"
      >
      </div>


    </section>



    <!-- SHARED MEDIA -->

    <section class="profile-section">


      <h2 class="profile-section-title">
        Shared Media
      </h2>


      <p class="profile-section-subtitle">
        Images and videos shared in chats will appear here.
      </p>


      <div class="media-empty">

        <div class="media-empty-icon">
          🖼️
        </div>

        <strong>
          No shared media yet
        </strong>

        <span>
          Media will appear here once the chat system is connected.
        </span>

      </div>


    </section>



    <!-- ERROR -->

    <div
      id="profileError"
      class="profile-error hidden"
    >
    </div>


  </main>



  <script
    type="module"
    src="js/profile.js"
  ></script>


</body>

</html>

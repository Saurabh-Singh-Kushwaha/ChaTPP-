<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c63ff">

  <title>Privacy Lock</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="privacy-page">

    <section class="privacy-card">

      <div class="privacy-icon">🔐</div>

      <h1 id="privacyTitle">
        Privacy Lock
      </h1>

      <p id="privacyDescription">
        Protect your account with a private PIN.
      </p>


      <!-- SETUP -->

      <div id="setupSection">

        <label for="newPin">
          Create Privacy PIN
        </label>

        <input
          id="newPin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          placeholder="4–6 digit PIN"
          autocomplete="new-password"
        >

        <label for="confirmPin">
          Confirm Privacy PIN
        </label>

        <input
          id="confirmPin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter PIN again"
          autocomplete="new-password"
        >

        <button
          id="savePinBtn"
          class="primary-btn"
          type="button"
        >
          Set Privacy Lock
        </button>

      </div>


      <!-- UNLOCK -->

      <div
        id="unlockSection"
        class="hidden"
      >

        <label for="unlockPin">
          Enter Privacy PIN
        </label>

        <input
          id="unlockPin"
          type="password"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter your PIN"
          autocomplete="current-password"
        >

        <button
          id="unlockBtn"
          class="primary-btn"
          type="button"
        >
          Unlock
        </button>

      </div>


      <p
        id="privacyMessage"
        class="auth-message"
        aria-live="polite"
      ></p>


      <button
        id="logoutBtn"
        class="secondary-btn"
        type="button"
      >
        Logout
      </button>

    </section>

  </main>


  <script
    type="module"
    src="js/privacy-lock.js"
  ></script>

</body>
</html>
